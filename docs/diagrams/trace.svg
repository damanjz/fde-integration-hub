4" fill="#141414" stroke="none" stroke-width="1.5" data-id="lane-other"/><text x="1434.0" y="231.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0" data-box="lane-other">Helpdesk + Accounting</text><text x="224.0" y="296.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">POST evt_1_00042, order.paid, order LF-10042, X-Larkfield-Signature</text><circle cx="76.0" cy="312.0" r="12" fill="#141414"/><text x="76.0" y="316.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">1</text><path d="M216.0 312.0 L408.0 312.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="428.0" y="360.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="canvas">HMAC verified; raw event + 3 delivery rows in one transaction</text><circle cx="76.0" cy="376.0" r="12" fill="#141414"/><text x="76.0" y="380.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">2</text><path d="M420.0 376.0 L612.0 376.0" fill="none" stroke="#8c8a85" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="224.0" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">200 accepted</text><circle cx="76.0" cy="440.0" r="12" fill="#fe6608"/><text x="76.0" y="444.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.0">3</text><path d="M408.0 440.0 L216.0 440.0" fill="none" stroke="#fe6608" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="224.0" y="488.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">same event id sent again (a retry)</text><circle cx="76.0" cy="504.0" r="12" fill="#141414"/><text x="76.0" y="508.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">4</text><path d="M216.0 504.0 L408.0 504.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="224.0" y="552.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">200 duplicate; nothing stored</text><circle cx="76.0" cy="568.0" r="12" fill="#fe6608"/><text x="76.0" y="572.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.0">5</text><path d="M408.0 568.0 L216.0 568.0" fill="none" stroke="#fe6608" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="632.0" y="616.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="canvas">claim warehouse row, lease; supersede check: no later event</text><circle cx="76.0" cy="632.0" r="12" fill="#141414"/><text x="76.0" y="636.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">6</text><path d="M816.0 632.0 L624.0 632.0" fill="none" stroke="#8c8a85" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="836.0" y="680.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">map to warehouse schema; pass_gate: token and breaker</text><circle cx="76.0" cy="696.0" r="12" fill="#141414"/><text x="76.0" y="700.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">7</text><path d="M828.0 696.0 L1020.0 696.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="1040.0" y="744.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">POST prepare, external_ref = delivery key</text><circle cx="76.0" cy="760.0" r="12" fill="#141414"/><text x="76.0" y="764.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">8</text><path d="M1032.0 760.0 L1224.0 760.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="1040.0" y="808.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">503</text><circle cx="76.0" cy="824.0" r="12" fill="#141414"/><text x="76.0" y="828.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">9</text><path d="M1224.0 824.0 L1032.0 824.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="632.0" y="872.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="canvas">mark_retry: jittered backoff, reconcile flagged</text><circle cx="76.0" cy="888.0" r="12" fill="#141414"/><text x="76.0" y="892.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">10</text><path d="M816.0 888.0 L624.0 888.0" fill="none" stroke="#8c8a85" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="1040.0" y="936.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">later: GET /shipments?external_ref finds nothing; resend</text><circle cx="76.0" cy="952.0" r="12" fill="#141414"/><text x="76.0" y="956.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">11</text><path d="M1032.0 952.0 L1224.0 952.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="1040.0" y="1000.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">201 created</text><circle cx="76.0" cy="1016.0" r="12" fill="#fe6608"/><text x="76.0" y="1020.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.0">12</text><path d="M1224.0 1016.0 L1032.0 1016.0" fill="none" stroke="#fe6608" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="632.0" y="1064.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="canvas">mark_delivered under the lease token</text><circle cx="76.0" cy="1080.0" r="12" fill="#141414"/><text x="76.0" y="1084.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e9e9e7" text-anchor="middle" letter-spacing="0.0">13</text><path d="M816.0 1080.0 L624.0 1080.0" fill="none" stroke="#8c8a85" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="836.0" y="1128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">helpdesk (Idempotency-Key) and accounting (invoice number): delivered</text><circle cx="76.0" cy="1144.0" r="12" fill="#fe6608"/><text x="76.0" y="1148.5" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.0">14</text><path d="M828.0 1144.0 L1428.0 1144.0" fill="none" stroke="#fe6608" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><text x="64.0" y="1232.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8c8a85" text-anchor="start" letter-spacing="0.0" data-box="canvas">Event and order ids are illustrative, in the chaos run's format. Grey arrows are Postgres reads and writes. Helpdesk and accounting rows run in parallel, each with its own gate.</text></svg>