<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="How one order event reaches three systems, once in effect"><title>How one order event reaches three systems, once in effect</title><defs><marker id="dk-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="980" rx="28" fill="#e9e9e7" data-id="canvas"/><text x="64.0" y="84.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="2" data-box="canvas">FDE PORTFOLIO · 02</text><text x="64.0" y="128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">How one order event reaches three systems, once in effect</text><rect x="64.0" y="265.0" width="218.9" height="184.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="storefront"/><text x="86.0" y="301.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="storefront">SOURCE</text><text x="86.0" y="339.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="storefront">Storefront</text><text x="86.0" y="373.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="storefront">Mock; signs each</text><text x="86.0" y="397.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="storefront">webhook</text><text x="86.0" y="421.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="storefront">Retries on any non-2xx</text><rect x="64.0" y="483.0" width="218.9" height="238.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="operator"/><text x="86.0" y="519.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="operator">OPERATORS</text><text x="86.0" y="557.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="operator">Replay, skip,</text><text x="86.0" y="587.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="operator">metrics</text><text x="86.0" y="621.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="operator">Admin key on every</text><text x="86.0" y="645.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="operator">route</text><text x="86.0" y="669.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="operator">Every action audited</text><text x="86.0" y="693.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="operator">with actor and reason</text><rect x="338.9" y="329.0" width="218.9" height="328.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="intake"/><text x="360.9" y="365.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="intake">INTAKE</text><text x="360.9" y="403.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="intake">Webhook intake</text><text x="360.9" y="437.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">Constant-time HMAC,</text><text x="360.9" y="461.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">5-minute window, two</text><text x="360.9" y="485.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">secrets</text><text x="360.9" y="509.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">Duplicate event id</text><text x="360.9" y="533.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">answers 200</text><text x="360.9" y="557.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">Raw body stored once</text><text x="360.9" y="581.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">One outbox row per</text><text x="360.9" y="605.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">destination, one</text><text x="360.9" y="629.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="intake">transaction</text><rect x="613.9" y="196.0" width="372.2" height="594.0" rx="16" fill="#fe6608" stroke="none" stroke-width="1.5" data-id="core"/><text x="635.9" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.5" data-box="core">DELIVERY ENGINE</text><text x="635.9" y="274.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Outbox and workers</text><text x="635.9" y="302.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">No broker; Postgres is the queue</text><rect x="635.9" y="322.0" width="328.2" height="226.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5" data-id="outbox"/><text x="657.9" y="366.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="outbox">Outbox</text><text x="657.9" y="400.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="outbox">Claim with FOR UPDATE SKIP</text><text x="657.9" y="424.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="outbox">LOCKED, lease, fenced result</text><text x="657.9" y="448.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="outbox">Per-order order; behind a dead row,</text><text x="657.9" y="472.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="outbox">later rows block</text><text x="657.9" y="496.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="outbox">Stale events marked superseded, never</text><text x="657.9" y="520.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="outbox">sent</text><rect x="635.9" y="566.0" width="328.2" height="202.0" rx="16" fill="#141414" stroke="none" stroke-width="1.5" data-id="worker"/><text x="657.9" y="610.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e9e9e7" text-anchor="start" letter-spacing="0.0" data-box="worker">Workers</text><text x="657.9" y="644.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="worker">Map to each schema, deterministic</text><text x="657.9" y="668.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="worker">delivery key</text><text x="657.9" y="692.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="worker">Look up before resending after an</text><text x="657.9" y="716.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="worker">unknown outcome</text><text x="657.9" y="740.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="worker">Retry with jitter; 4xx is dead at once</text><rect x="1042.1" y="329.0" width="218.9" height="328.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="gate"/><text x="1064.1" y="365.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="gate">LIMITS</text><text x="1064.1" y="403.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="gate">Gate and client</text><text x="1064.1" y="437.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Token bucket,</text><text x="1064.1" y="461.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Retry-After and circuit</text><text x="1064.1" y="485.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">breaker in one Postgres</text><text x="1064.1" y="509.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">row</text><text x="1064.1" y="533.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Each 429 cuts the rate</text><text x="1064.1" y="557.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Token refresh on 401</text><text x="1064.1" y="581.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="gate">Every call recorded</text><rect x="1317.1" y="207.0" width="218.9" height="184.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="warehouse"/><text x="1339.1" y="243.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="warehouse">DESTINATION</text><text x="1339.1" y="281.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="warehouse">Warehouse</text><text x="1339.1" y="315.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="warehouse">OAuth2, 5 req/s, no</text><text x="1339.1" y="339.0" font-family="Segoe UI, Inter, -apple-system, He